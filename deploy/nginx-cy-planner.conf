# /etc/nginx/sites-available/cy-planner
# Remplace planner.example.fr par ton sous-domaine. Certbot ajoutera lui-même le bloc 443 + redirection.
server {
    listen 80;
    listen [::]:80;
    server_name planner.example.fr;

    # Uploads de cours (PDF, archives…) : aligné sur MAX_UPLOAD_MB
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # Le service worker ne doit jamais être mis en cache par un proxy
    location = /sw.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
