# /etc/apache2/sites-available/cy-planner.conf  (si ton site existant tourne sous Apache)
# a2enmod proxy proxy_http headers rewrite && a2ensite cy-planner && systemctl reload apache2
<VirtualHost *:80>
    ServerName planner.example.fr
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    LimitRequestBody 104857600
</VirtualHost>
